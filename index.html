/* ---------- Week & schedule helpers ---------- */
const WEEKDAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// 0 = Sunday, 1 = Monday. "auto" starts the week on Sunday when the plan's first day is a Sunday.
function getWeekStartDay(){
  if(profile.weekStart === 'sun') return 0;
  if(profile.weekStart === 'mon') return 1;
  return (program[0] && dayWeekday(program[0]) === 0) ? 0 : 1;
}

function startOfWeek(weeksAgo, from){
  const d = from ? new Date(from) : new Date();
  d.setHours(0,0,0,0);
  const diff = (d.getDay() - getWeekStartDay() + 7) % 7;
  d.setDate(d.getDate() - diff - (weeksAgo || 0) * 7);
  return d;
}

function weekRange(weeksAgo){
  const start = startOfWeek(weeksAgo);
  const end = new Date(start); end.setDate(start.getDate() + 7);
  return { start, end };
}

function sessionsInWeek(weeksAgo){
  const { start, end } = weekRange(weeksAgo);
  return history.filter(s => { const d = new Date(s.date); return d >= start && d < end; });
}

// Weekday a program day is scheduled on, read from a "Mon – Legs" style name; null if none.
function dayWeekday(day){
  if(!day) return null;
  if(typeof day.weekday === 'number') return day.weekday;
  const m = String(day.name || '').trim().toLowerCase().match(/^(sun|mon|tue|wed|thu|fri|sat)/);
  return m ? WEEKDAY_KEYS.indexOf(m[1]) : null;
}

function completedIdsInWeek(weeksAgo){
  const set = new Set();
  sessionsInWeek(weeksAgo).forEach(sess => {
    set.add(sess.dayId);
    if(sess.dayName) set.add('name:' + sess.dayName);
  });
  return set;
}

function plannedDaysDoneInWeek(weeksAgo){
  const set = completedIdsInWeek(weeksAgo);
  return program.filter(d => isDayCompletedThisWeek(d, set)).length;
}

function getThisWeekSessions(){ return sessionsInWeek(0); }
function getWeekSessionsCount(weeksAgo){ return sessionsInWeek(weeksAgo).length; }

// Volume in stored units (lb). With sameElapsed, only counts up to the same point in that week as now.
function getWeekVolume(weeksAgo, sameElapsed){
  let vol = 0;
  const cutoff = sameElapsed ? weekRange(weeksAgo).start.getTime() + (Date.now() - weekRange(0).start.getTime()) : Infinity;
  sessionsInWeek(weeksAgo).filter(s => new Date(s.date).getTime() <= cutoff).forEach(sess => {
    Object.values(sess.exercises).forEach(sets => {
      sets.forEach(s => { vol += (Number(s.weight) || 0) * (Number(s.reps) || 0); });
    });
  });
  return vol;
}

function formatVolume(lbVol){
  const v = Math.round(toDisplayWeight(lbVol) || 0);
  return v >= 1000 ? (v/1000).toFixed(1) + 'k' : String(v);
}

// Number of weeks (including the current one) since the first logged session.
function weeksOfHistory(){
  if(!history.length) return 0;
  const first = history.reduce((a, s) => new Date(s.date) < a ? new Date(s.date) : a, new Date(history[0].date));
  const firstWeek = startOfWeek(0, first);
  return Math.round((startOfWeek(0) - firstWeek) / (7 * 864e5)) + 1;
}

function getConsistencyStats(){
  const target = program.length;
  const histWeeks = weeksOfHistory();
  const doneByWeek = w => plannedDaysDoneInWeek(w);

  // Adherence over completed weeks (the current week isn't over yet).
  const adherence = n => {
    const weeks = Math.min(n, Math.max(histWeeks - 1, 0));
    if(!weeks || !target) return null;
    let done = 0;
    for(let w = 1; w <= weeks; w++) done += Math.min(doneByWeek(w), target);
    return { pct: Math.round(done / (weeks * target) * 100), weeks, done, possible: weeks * target };
  };

  // Full weeks = every planned day done. The current week counts once it's full.
  let currentFull = 0;
  if(target){
    if(doneByWeek(0) >= target) currentFull++;
    for(let w = 1; w < histWeeks; w++){
      if(doneByWeek(w) >= target) currentFull++; else break;
    }
  }
  let bestFull = 0, run = 0;
  for(let w = histWeeks - 1; w >= 0; w--){
    if(target && doneByWeek(w) >= target){ run++; bestFull = Math.max(bestFull, run); }
    else run = 0;
  }

  // Weeks in a row with at least one workout (the current week doesn't break it).
  let activeStreak = 0;
  for(let w = 0; w < Math.max(histWeeks, 1); w++){
    if(sessionsInWeek(w).length) activeStreak++;
    else if(w > 0) break;
  }

  let daysSince = null;
  if(history.length){
    const last = history.reduce((a, s) => new Date(s.date) > a ? new Date(s.date) : a, new Date(0));
    const a = new Date(); a.setHours(0,0,0,0);
    const b = new Date(last); b.setHours(0,0,0,0);
    daysSince = Math.round((a - b) / 864e5);
  }

  // How often each planned day got done over the last 8 completed weeks.
  const perDayWeeks = Math.min(8, Math.max(histWeeks - 1, 0));
  const perDay = program.map(day => {
    let done = 0;
    for(let w = 1; w <= perDayWeeks; w++){
      if(isDayCompletedThisWeek(day, completedIdsInWeek(w))) done++;
    }
    return { day, done, weeks: perDayWeeks };
  });

  return { target, histWeeks, a4: adherence(4), a12: adherence(12), currentFull, bestFull, activeStreak, daysSince, perDay };
}

/* ---------- Today's plan ---------- */
function getTodayPlan(){
  const today = new Date().getDay();
  const scheduled = program.filter(d => dayWeekday(d) !== null);
  if(!scheduled.length) return null;
  const doneSet = completedIdsInWeek(0);
  const todayDay = scheduled.find(d => dayWeekday(d) === today) || null;
  let next = null;
  for(let i = 1; i <= 7 && !next; i++){
    const wd = (today + i) % 7;
    const d = scheduled.find(x => dayWeekday(x) === wd);
    if(d) next = { day: d, inDays: i };
  }
  return { todayDay, todayDone: todayDay ? isDayCompletedThisWeek(todayDay, doneSet) : false, next };
}

/* ---------- Consistency calendar (last 12 weeks + this week) ---------- */
function renderConsistencyCalendar(){
  const WEEKS = 13;
  const weekStart = getWeekStartDay();
  const today = new Date(); today.setHours(0,0,0,0);
  const firstSession = history.length ? history.reduce((a, s) => new Date(s.date) < a ? new Date(s.date) : a, new Date(history[0].date)) : today;
  const trackingStart = startOfWeek(0, firstSession);
  const sessionsByDate = {};
  history.forEach(s => {
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const key = d.toDateString();
    (sessionsByDate[key] = sessionsByDate[key] || []).push(s);
  });
  const scheduledByWeekday = {};
  program.forEach(d => { const wd = dayWeekday(d); if(wd !== null) scheduledByWeekday[wd] = d; });

  const CELL = 18, GAP = 4, LABEL_W = 16, TOP = 14;
  const W = LABEL_W + WEEKS * (CELL + GAP), H = TOP + 7 * (CELL + GAP);
  let cells = '';
  let monthLabels = '';
  let lastMonth = -1;
  for(let c = 0; c < WEEKS; c++){
    const colStart = startOfWeek(WEEKS - 1 - c);
    if(colStart.getMonth() !== lastMonth){
      lastMonth = colStart.getMonth();
      monthLabels += `<text x="${LABEL_W + c * (CELL + GAP)}" y="9" class="cal-txt">${colStart.toLocaleDateString(undefined,{month:'short'})}</text>`;
    }
    const doneSet = completedIdsInWeek(WEEKS - 1 - c);
    for(let r = 0; r < 7; r++){
      const d = new Date(colStart); d.setDate(colStart.getDate() + r);
      const x = LABEL_W + c * (CELL + GAP), y = TOP + r * (CELL + GAP);
      const sess = sessionsByDate[d.toDateString()] || [];
      const planned = scheduledByWeekday[d.getDay()];
      const dateLabel = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
      let cls, info;
      if(d > today){
        cls = planned ? 'cal-future-plan' : 'cal-future';
        info = planned ? `${dateLabel}: ${planned.name} planned` : `${dateLabel}`;
      }else if(sess.length){
        cls = 'cal-done';
        info = `${dateLabel}: ${sess.map(s => s.dayName || (program.find(p => p.id === s.dayId) || {}).name || 'Workout').join(', ')} ✓`;
      }else if(planned && !isDayCompletedThisWeek(planned, doneSet) && d < today && d >= trackingStart){
        cls = 'cal-missed';
        info = `${dateLabel}: ${planned.name} missed`;
      }else if(planned && d.getTime() === today.getTime()){
        cls = 'cal-today-plan';
        info = `${dateLabel}: ${planned.name} today`;
      }else{
        cls = 'cal-empty';
        info = planned ? `${dateLabel}: ${planned.name} (done another day)` : `${dateLabel}: rest`;
      }
      const isToday = d.getTime() === today.getTime();
      cells += `<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="4" class="cal-cell ${cls}${isToday ? ' cal-today' : ''}"
        data-info="${escapeHtml(info)}" onclick="showCalInfo(this)"><title>${escapeHtml(info)}</title></rect>`;
    }
  }
  let rowLabels = '';
  for(let r = 0; r < 7; r++){
    const wd = (weekStart + r) % 7;
    if(r % 2 === 0) rowLabels += `<text x="0" y="${TOP + r * (CELL + GAP) + CELL - 5}" class="cal-txt">${WEEKDAY_NAMES[wd][0]}</text>`;
  }
  return `<div class="cal-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 1.25}px" role="img" aria-label="Workout calendar for the last ${WEEKS} weeks">
      ${monthLabels}${rowLabels}${cells}
    </svg></div>
    <div class="cal-legend">
      <span><i class="cal-key cal-done"></i>Workout</span>
      <span><i class="cal-key cal-missed"></i>Planned, missed</span>
      <span><i class="cal-key cal-future-plan"></i>Planned</span>
      <span><i class="cal-key cal-empty"></i>Rest</span>
    </div>
    <p class="cal-info" id="cal-info">Tap a day for details.</p>`;
}

function showCalInfo(el){
  const out = document.getElementById('cal-info');
  if(out) out.textContent = el.getAttribute('data-info');
  document.querySelectorAll('.cal-cell.cal-selected').forEach(c => c.classList.remove('cal-selected'));
  el.classList.add('cal-selected');
}

/* ---------- Weekly bars with target line (last 12 weeks) ---------- */
function renderWeeklyBars(target){
  const N = 12;
  const counts = Array.from({length:N}, (_, i) => plannedDaysDoneInWeek(N - 1 - i));
  const extra = Array.from({length:N}, (_, i) => Math.max(0, sessionsInWeek(N - 1 - i).length - counts[i]));
  const maxV = Math.max(target, ...counts.map((c, i) => c + extra[i]), 1);
  const W = 300, H = 120, PL = 4, PR = 4, PT = 14, PB = 18;
  const slot = (W - PL - PR) / N, bw = Math.min(16, slot - 6);
  const y = v => PT + (1 - v / maxV) * (H - PT - PB);
  let bars = '';
  counts.forEach((c, i) => {
    const x = PL + i * slot + (slot - bw) / 2;
    const { start } = weekRange(N - 1 - i);
    const label = start.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    const isCur = i === N - 1;
    const full = target && c >= target;
    const tip = `Week of ${label}: ${c}/${target} planned days${extra[i] ? ` + ${extra[i]} extra` : ''}${isCur ? ' (in progress)' : ''}`;
    if(c > 0){
      const showVal = c < target || !target;
      bars += `<path d="M${x},${y(0)} V${y(c) + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${y(0)} Z" class="wk-bar ${full ? 'wk-full' : ''} ${isCur ? 'wk-cur' : ''}"><title>${escapeHtml(tip)}</title></path>`;
      if(showVal) bars += `<text x="${x + bw/2}" y="${y(c) - 3}" text-anchor="middle" class="wk-val">${c}</text>`;
    }else{
      bars += `<rect x="${x}" y="${y(0) - 2}" width="${bw}" height="2" class="wk-zero"><title>${escapeHtml(tip)}</title></rect>`;
    }
    bars += `<rect x="${PL + i * slot}" y="${PT}" width="${slot}" height="${H - PT - PB}" fill="transparent"><title>${escapeHtml(tip)}</title></rect>`;
    if(i % 3 === 2 || isCur){
      bars += `<text x="${x + bw/2}" y="${H - 4}" text-anchor="middle" class="cal-txt">${isCur ? 'Now' : label}</text>`;
    }
  });
  const ty = y(target);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Planned days completed per week">
      <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" class="wk-axis"/>
      ${target ? `<line x1="${PL}" x2="${W - PR}" y1="${ty}" y2="${ty}" class="wk-target"/>
      <text x="${PL}" y="${ty - 3}" class="cal-txt">all ${target} days</text>` : ''}
      ${bars}
    </svg>`;
}

function calcWeeklyVolume(){
  // Top 5 exercises by total weight × reps this week
  const weekSessions = getThisWeekSessions();
  const vol = {};
  weekSessions.forEach(sess => {
    Object.keys(sess.exercises).forEach(key => {
      const sets = sess.exercises[key];
      const exMeta = findExerciseMetaByCanonical(key);
      if(!exMeta || exMeta.bw) return;
      const name = exMeta ? exMeta.name : key;
      vol[name] = (vol[name] || 0) + sets.reduce((s,r) => s + r.weight * r.reps, 0);
    });
  });
  return Object.entries(vol)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 5)
    .map(([name, total]) => ({ name, total: Math.round(toDisplayWeight(total)) }));
}

function getAllTimePRs(){
  const prs = {};
  program.forEach(day => {
    day.exercises.forEach(ex => {
      const best = bestFor(ex);
      if(best && best.score > 0){
        // Find when this PR was set and what the first session looked like
        const sessions = getSessionHistoryFor(ex);
        const prDate = sessions.length ? new Date(history.filter(sess => {
          const k = canonicalize(ex.name);
          return sess.exercises[k] || (ex.id && sess.exercises[ex.id]);
        }).reverse().find(sess => {
          const k = canonicalize(ex.name);
          const sets = sess.exercises[k] || (ex.id && sess.exercises[ex.id]) || [];
          const top = sets.reduce ? sets.reduce((a,b) => progressScore(ex,b.weight,b.reps) > progressScore(ex,a.weight,a.reps) ? b : a, sets[0]) : null;
          return top && Math.abs(progressScore(ex,top.weight,top.reps) - best.score) < 0.01;
        })?.date) : null;

        const firstScore = sessions.length ? sessions[0].score : null;
        prs[ex.name] = { ex, best, prDate, firstScore, sessionCount: sessions.length };
      }
    });
  });
  return Object.values(prs).sort((a,b) => b.sessionCount - a.sessionCount);
}

function getExercisesWithHistory(){
  const result = [];
  const seen = new Set();
  program.forEach(day => {
    day.exercises.forEach(ex => {
      const key = canonicalize(ex.name);
      if(seen.has(key)) return;
      seen.add(key);
      const sessions = getSessionHistoryFor(ex);
      if(sessions.length >= 2) result.push({ ex, sessions });
    });
  });
  return result;
}

function drawChart(sessions, ex){
  if(!sessions || sessions.length < 2) return '';
  const vals = sessions.map(s => s.score);
  const min = Math.min(...vals) * 0.97;
  const max = Math.max(...vals) * 1.03;
  const range = max - min || 1;
  const W = 280, H = 100, PL = 4, PR = 4, PT = 8, PB = 20;
  const pts = vals.map((v, i) => {
    const x = PL + (i / (vals.length - 1)) * (W - PL - PR);
    const y = PT + (1 - (v - min) / range) * (H - PT - PB);
    return [Math.round(x*10)/10, Math.round(y*10)/10];
  });
  const line = pts.map((p,i) => (i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(' ');
  const area = line + ` L${pts[pts.length-1][0]},${H-PB} L${pts[0][0]},${H-PB} Z`;

  const unit = ex.bw ? 'reps' : weightUnit;
  const labels = sessions.map(s => {
    const v = ex.bw ? s.maxReps : toDisplayWeight(s.topSet.weight);
    return { x: pts[sessions.indexOf(s)][0], val: v };
  });

  const trend = vals[vals.length-1] > vals[0]*1.01 ? '↑ Improving' :
                vals[vals.length-1] < vals[0]*0.99 ? '↓ Declining' : '→ Consistent';
  const trendColor = trend.startsWith('↑') ? 'var(--brass)' : trend.startsWith('↓') ? 'var(--accent)' : 'var(--text-dim)';

  const firstVal = ex.bw ? sessions[0].maxReps : toDisplayWeight(sessions[0].topSet.weight);
  const lastVal = ex.bw ? sessions[sessions.length-1].maxReps : toDisplayWeight(sessions[sessions.length-1].topSet.weight);

  const dates = sessions.map(s => new Date(s.date));
  const firstDate = dates[0].toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const lastDate = dates[dates.length-1].toLocaleDateString(undefined,{month:'short',day:'numeric'});

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem;gap:0.5rem;">
      <div style="font-size:0.78rem;color:var(--text-dim)">${firstDate}: <span style="color:var(--text);font-family:monospace">${firstVal}${unit}</span></div>
      <div style="font-size:0.78rem;font-weight:600;color:${trendColor}">${trend}</div>
      <div style="font-size:0.78rem;color:var(--text-dim)">${lastDate}: <span style="color:var(--brass);font-family:monospace">${lastVal}${unit}</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="overflow:visible">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--brass)" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="var(--brass)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${area}" fill="url(#cg)"/>
      <path d="${line}" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p,i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--brass)" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;margin-top:0.25rem;">
      <span style="font-size:0.6rem;color:var(--text-dim)">${firstDate}</span>
      <span style="font-size:0.6rem;color:var(--text-dim)">${sessions.length} sessions</span>
      <span style="font-size:0.6rem;color:var(--text-dim)">${lastDate}</span>
    </div>`;
}

function renderDashboard(){
  const weekSessions = getThisWeekSessions();
  const totalDays = program.length;
  const completedSet = getThisWeekCompletedDayIds();
  const completedCount = program.filter(d => isDayCompletedThisWeek(d, completedSet)).length;
  const prs = getAllTimePRs();
  const totalSessions = history.length;
  const exWithHistory = getExercisesWithHistory();
  const stats = getConsistencyStats();
  const plan = getTodayPlan();

  const thisWeekCount = weekSessions.length;
  const thisVol = getWeekVolume(0);
  const lastVol = getWeekVolume(1, true);
  const volDelta = lastVol > 0 ? Math.round((thisVol - lastVol) / lastVol * 100) : 0;

  // Ring
  const pct = totalDays > 0 ? Math.min(completedCount / totalDays, 1) : 0;
  const R=44, CX=52, CY=52, STR=8;
  const circ = 2*Math.PI*R;
  const dash = pct*circ;
  const ringColor = pct>=1 ? 'var(--brass)' : 'var(--accent)';
  const ringSvg = `<svg class="dash-ring" width="104" height="104" viewBox="0 0 104 104">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="${STR}"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${ringColor}" stroke-width="${STR}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
      transform="rotate(-90 ${CX} ${CY})"/>
    <text x="${CX}" y="${CY-6}" text-anchor="middle" dominant-baseline="central"
      font-family="JetBrains Mono,monospace" font-size="18" font-weight="600" fill="var(--text)">${completedCount}/${totalDays}</text>
    <text x="${CX}" y="${CY+14}" text-anchor="middle" font-family="sans-serif" font-size="9" fill="var(--text-dim)">DAYS</text>
  </svg>`;

  const { start: wkStart, end: wkEnd } = weekRange(0);
  const wkEndShown = new Date(wkEnd); wkEndShown.setDate(wkEnd.getDate() - 1);
  const fmt = d => d.toLocaleDateString(undefined,{month:'short', day:'numeric'});

  let html = `<h2 class="day-head" style="margin-bottom:1.1rem">Dashboard</h2>`;

  /* ---- Today ---- */
  if(plan){
    if(plan.todayDay && !plan.todayDone){
      html += `<button class="dash-start-btn dash-today-btn" onclick="selectDay('${plan.todayDay.id}')">Today: ${escapeHtml(plan.todayDay.name)} →</button>`;
    }else{
      const head = plan.todayDay ? `✓ ${escapeHtml(plan.todayDay.name)} done today` : 'No lifting planned today';
      const nextTxt = plan.next ? `Next: ${escapeHtml(plan.next.day.name)} ${plan.next.inDays === 1 ? 'tomorrow' : 'on ' + WEEKDAY_NAMES[dayWeekday(plan.next.day)]}` : '';
      html += `<div class="dash-today"><span class="dash-today-head">${head}</span>${nextTxt ? `<span class="dash-today-next">${nextTxt}</span>` : ''}</div>`;
    }
  }

  /* ---- This week ---- */
  html += `<div class="dash-grid">
    <div class="dash-card full">
      <div class="dash-card-label">This week · ${fmt(wkStart)} – ${fmt(wkEndShown)}</div>
      <div class="dash-ring-wrap">
        ${ringSvg}
        <div class="dash-ring-info">
          <div class="dash-ring-stat">
            <span class="dash-ring-stat-val">${thisWeekCount}</span>
            <span class="dash-ring-stat-label">Session${thisWeekCount === 1 ? '' : 's'} logged</span>
          </div>
          <div class="dash-ring-stat">
            <span class="dash-ring-stat-val">${stats.daysSince === null ? '—' : stats.daysSince === 0 ? 'Today' : stats.daysSince + 'd'}</span>
            <span class="dash-ring-stat-label">${stats.daysSince === null || stats.daysSince === 0 ? 'Last workout' : 'Since last workout'}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="dash-card">
      <div class="dash-card-label">Volume</div>
      <div class="dash-card-value" style="font-size:1.3rem">${thisVol > 0 ? formatVolume(thisVol) : '—'}</div>
      <div class="dash-card-sub">${weightUnit} lifted this week</div>
      ${thisVol > 0 && lastVol > 0 ? `<div class="dash-card-delta ${volDelta>0?'up':volDelta<0?'down':'flat'}">${volDelta>0?'↑ +':volDelta<0?'↓ ':'→ '}${Math.abs(volDelta)}% vs this point last week</div>` : ''}
    </div>
    <div class="dash-card">
      <div class="dash-card-label">All time</div>
      <div class="dash-card-value">${totalSessions}</div>
      <div class="dash-card-sub">Sessions · ${prs.length} exercise${prs.length === 1 ? '' : 's'} with a PR</div>
    </div>
  </div>`;

  /* ---- Consistency ---- */
  html += `<p class="dash-section-title"><span>Consistency</span></p>`;
  if(!history.length){
    html += `<div class="dash-card full"><p class="dash-no-data" style="padding:0.5rem 0">Your consistency stats appear here after your first logged workout.</p></div>`;
  }else{
    const pctCard = (a, label) => {
      if(!a) return `<div class="dash-card"><div class="dash-card-label">${label}</div><div class="dash-card-value">—</div><div class="dash-card-sub">Needs one full week</div></div>`;
      const cls = a.pct >= 80 ? 'up' : a.pct >= 50 ? 'flat' : 'down';
      return `<div class="dash-card"><div class="dash-card-label">${label}</div>
        <div class="dash-card-value">${a.pct}%</div>
        <div class="dash-card-sub">${a.done} of ${a.possible} planned days${a.weeks < (label.includes('12') ? 12 : 4) ? ` · ${a.weeks} wk${a.weeks === 1 ? '' : 's'} so far` : ''}</div>
        <div class="dash-meter"><span class="${cls}" style="width:${a.pct}%"></span></div></div>`;
    };
    html += `<div class="dash-grid">
      ${pctCard(stats.a4, 'Last 4 weeks')}
      ${pctCard(stats.a12, 'Last 12 weeks')}
      <div class="dash-card"><div class="dash-card-label">Full-week streak</div>
        <div class="dash-card-value" style="color:var(--brass)">${stats.currentFull}</div>
        <div class="dash-card-sub">Weeks in a row with all ${totalDays} days done · best ${stats.bestFull}</div></div>
      <div class="dash-card"><div class="dash-card-label">Active streak</div>
        <div class="dash-card-value">${stats.activeStreak}</div>
        <div class="dash-card-sub">Week${stats.activeStreak === 1 ? '' : 's'} in a row with at least one workout</div></div>
    </div>`;

    html += `<div class="dash-card full" style="margin-bottom:0.85rem">
      <div class="dash-card-label">Last 13 weeks</div>
      ${renderConsistencyCalendar()}
    </div>`;

    html += `<div class="dash-card full" style="margin-bottom:0.85rem">
      <div class="dash-card-label">Planned days done per week</div>
      ${renderWeeklyBars(totalDays)}
    </div>`;

    if(stats.perDay.length && stats.perDay[0].weeks > 0){
      html += `<div class="dash-card full">
        <div class="dash-card-label">Which days you skip · last ${stats.perDay[0].weeks} week${stats.perDay[0].weeks === 1 ? '' : 's'}</div>`;
      stats.perDay.forEach(({day, done, weeks}) => {
        const p = Math.round(done / weeks * 100);
        html += `<div class="dash-volume-row" style="margin:0.35rem 0 0">
          <div class="dash-volume-label" title="${escapeHtml(day.name)}">${escapeHtml(day.name)}</div>
          <div class="dash-volume-bar-bg"><div class="dash-volume-bar ${p >= 80 ? 'good' : ''}" style="width:${Math.max(p, 2)}%"></div></div>
          <div class="dash-volume-val">${done}/${weeks}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  /* ---- Progress chart with exercise selector ---- */
  if(exWithHistory.length > 0){
    if(dashChartExIdx >= exWithHistory.length) dashChartExIdx = 0;
    const selected = exWithHistory[dashChartExIdx];
    html += `<p class="dash-section-title"><span>Strength progress</span></p>`;
    html += `<div class="dash-chart-ex-selector">`;
    exWithHistory.slice(0, 8).forEach(({ex}, idx) => {
      html += `<button class="dash-ex-pill ${idx===dashChartExIdx?'active':''}" onclick="dashChartExIdx=${idx};renderDashboard()">${escapeHtml(ex.name)}</button>`;
    });
    html += `</div>`;
    html += `<div class="dash-card full">${drawChart(selected.sessions, selected.ex)}</div>`;
  }

  /* ---- Weekly volume breakdown ---- */
  const volBreakdown = calcWeeklyVolume();
  if(volBreakdown.length > 0){
    const maxVol = volBreakdown[0].total;
    html += `<p class="dash-section-title"><span>Volume this week</span></p>
    <div class="dash-card full" style="gap:0.5rem;">`;
    volBreakdown.forEach(({name, total}) => {
      const pct = Math.round((total / maxVol) * 100);
      html += `<div class="dash-volume-row">
        <div class="dash-volume-label" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
        <div class="dash-volume-bar-bg"><div class="dash-volume-bar" style="width:${pct}%"></div></div>
        <div class="dash-volume-val">${total >= 1000 ? (total/1000).toFixed(1)+'k' : total}${weightUnit}</div>
      </div>`;
    });
    html += `</div>`;
  }

  /* ---- PRs with context ---- */
  if(prs.length > 0){
    html += `<p class="dash-section-title"><span>All-time PRs</span></p>
    <div class="dash-pr-list">`;
    prs.slice(0, 8).forEach(({ ex, best, prDate, firstScore, sessionCount }) => {
      const val = ex.bw
        ? `${best.reps} reps${best.weight ? ' +'+toDisplayWeight(best.weight)+weightUnit : ''}`
        : `${toDisplayWeight(best.weight)}${weightUnit} × ${best.reps}`;
      const prDateStr = prDate
        ? prDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
        : null;
      const improvement = firstScore && best.score > firstScore
        ? `+${Math.round((best.score - firstScore) / firstScore * 100)}% from first session`
        : null;
      html += `<div class="dash-pr-row">
        <div class="dash-pr-left">
          <span class="dash-pr-name">${escapeHtml(ex.name)}</span>
          ${prDateStr ? `<span class="dash-pr-since">Set ${prDateStr} · ${sessionCount} sessions</span>` : ''}
        </div>
        <div class="dash-pr-right">
          <span class="dash-pr-val">${val}</span>
          ${improvement ? `<span class="dash-pr-improvement">${improvement}</span>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  /* ---- Recent sessions ---- */
  const recent = [...history].reverse().slice(0, 5);
  if(recent.length > 0){
    html += `<p class="dash-section-title"><span>Recent sessions</span></p>
    <div class="dash-sessions">`;
    recent.forEach(sess => {
      const day = program.find(d => d.id === sess.dayId);
      const dayName = sess.dayName || (day ? day.name : 'Workout');
      const dateStr = new Date(sess.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
      const exCount = Object.keys(sess.exercises).length;
      html += `<div class="dash-session-row" onclick="selectHistory()">
        <div class="dash-session-dot"></div>
        <span class="dash-session-day">${escapeHtml(dayName)}</span>
        <div class="dash-session-meta">
          <span class="dash-session-date">${dateStr}</span>
          <span class="dash-session-excount">${exCount} exercise${exCount!==1?'s':''}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  /* ---- Empty state ---- */
  if(history.length === 0){
    html += `<div class="dash-no-data">No sessions logged yet.<br>Tap a day below to start your first workout.</div>`;
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('footer').innerHTML = '';
}


function render(){
  if(currentView === 'loading'){
    renderLoadingScreen();
    return;
  }
  renderNav();
  if(currentView === 'dashboard') renderDashboard();
  else if(currentView === 'history') renderHistory();
  else if(currentView === 'edit') renderEdit();
  else if(currentView === 'profile') renderProfile();
  else if(currentView === 'wizard') renderWizard();
  else if(currentView === 'wizard-resolve') renderWizardResolve();
  else renderLog();
}

/* ===================== Profile & suggested weights ===================== */
const STORAGE_PROFILE_KEY = 'iron-profile';
const DRIVE_PROFILE_FILE = 'iron-log-profile.json';
let profile = {};

async function loadProfile(){
  let loaded = null;
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_PROFILE_KEY, false);
      loaded = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ loaded = null; }
  }else{
    try{
      const raw = localStorage.getItem(STORAGE_PROFILE_KEY);
      loaded = raw ? JSON.parse(raw) : null;
    }catch(e){ loaded = null; }
  }
  profile = (loaded && typeof loaded === 'object') ? loaded : {};
}

async function saveProfile(){
  profile.updatedAt = new Date().toISOString();
  if(hasCloudStorage){
    try{ await window.storage.set(STORAGE_PROFILE_KEY, JSON.stringify(profile), false); return; }
    catch(e){ console.error('Could not save profile to cloud storage', e); return; }
  }
  try{ localStorage.setItem(STORAGE_PROFILE_KEY, JSON.stringify(profile)); }
  catch(e){ console.error('Could not save profile to local storage', e); }
}

function profileIsComplete(){
  return profile.weightKg > 0 && !!profile.sex && !!profile.experience;
}

// Starting working-set loads for 8-12 reps, as a fraction of body weight, for a new male lifter aged 18-39.
// "db" = per dumbbell. Matched against the exercise name, first match wins.
const STRENGTH_RATIOS = [
  { re:/front squat/,                                ratio:0.45, region:'lower' },
  { re:/goblet/,                                     ratio:0.20, region:'lower', db:true },
  { re:/split squat|lunge|step[- ]?up/,              ratio:0.10, region:'lower', db:true },
  { re:/hack squat/,                                 ratio:0.70, region:'lower' },
  { re:/leg press/,                                  ratio:1.20, region:'lower' },
  { re:/squat/,                                      ratio:0.60, region:'lower' },
  { re:/romanian|rdl|stiff/,                         ratio:0.50, region:'lower' },
  { re:/deadlift/,                                   ratio:0.75, region:'lower' },
  { re:/hip thrust|glute bridge/,                    ratio:0.60, region:'lower' },
  { re:/leg curl/,                                   ratio:0.35, region:'lower' },
  { re:/leg extension/,                              ratio:0.40, region:'lower' },
  { re:/calf/,                                       ratio:0.30, region:'lower' },
  { re:/kettlebell swing|kb swing/,                  ratio:0.20, region:'lower' },
  { re:/incline.*(db|dumbbell)|(db|dumbbell).*incline/, ratio:0.17, region:'upper', db:true },
  { re:/(db|dumbbell).*(bench|press)|(flat|bench).*(db|dumbbell)/, ratio:0.20, region:'upper', db:true, notIf:/shoulder|overhead/ },
  { re:/(db|dumbbell).*(shoulder|overhead) press|(shoulder|overhead).*(db|dumbbell)|arnold/, ratio:0.12, region:'upper', db:true },
  { re:/incline.*bench/,                             ratio:0.42, region:'upper' },
  { re:/bench press/,                                ratio:0.50, region:'upper' },
  { re:/overhead press|shoulder press|military/,     ratio:0.33, region:'upper' },
  { re:/lateral raise/,                              ratio:0.05, region:'upper', db:true, notIf:/cable/ },
  { re:/cable lateral/,                              ratio:0.04, region:'upper' },
  { re:/rear[- ]?delt|reverse fly/,                  ratio:0.04, region:'upper', db:true },
  { re:/pec deck|chest fly machine/,                 ratio:0.35, region:'upper' },
  { re:/fly/,                                        ratio:0.08, region:'upper', db:true },
  { re:/pushdown/,                                   ratio:0.20, region:'upper' },
  { re:/skull/,                                      ratio:0.20, region:'upper' },
  { re:/overhead.*(triceps|extension)/,              ratio:0.12, region:'upper' },
  { re:/straight[- ]arm/,                            ratio:0.20, region:'upper' },
  { re:/pulldown/,                                   ratio:0.50, region:'upper' },
  { re:/chest[- ]supported|single[- ]arm.*row|one[- ]arm.*row|(db|dumbbell).*row/, ratio:0.18, region:'upper', db:true },
  { re:/row/,                                        ratio:0.45, region:'upper' },
  { re:/face pull/,                                  ratio:0.15, region:'upper' },
  { re:/shrug/,                                      ratio:0.25, region:'upper', db:true },
  { re:/incline.*curl/,                              ratio:0.08, region:'upper', db:true },
  { re:/hammer/,                                     ratio:0.11, region:'upper', db:true },
  { re:/(ez|barbell).*curl/,                         ratio:0.25, region:'upper' },
  { re:/cable curl/,                                 ratio:0.20, region:'upper' },
  { re:/curl/,                                       ratio:0.10, region:'upper', db:true }
];

const EXPERIENCE_FACTOR = { beginner:1.0, intermediate:1.35, advanced:1.7 };

function sexFactor(region){
  if(profile.sex === 'male') return 1;
  if(profile.sex === 'female') return region === 'upper' ? 0.6 : 0.75;
  return region === 'upper' ? 0.8 : 0.87;
}

function ageFactor(){
  const a = Number(profile.age);
  if(!a) return 1;
  if(a < 16) return 0.75;
  if(a < 18) return 0.88;
  if(a < 40) return 1;
  if(a < 50) return 0.93;
  if(a < 60) return 0.85;
  if(a < 70) return 0.75;
  return 0.65;
}

// Above a BMI of 25, extra body weight is mostly not muscle, so only part of it counts.
function effectiveBodyWeightKg(){
  const w = Number(profile.weightKg);
  const h = Number(profile.heightCm) / 100;
  if(!h) return w;
  const ideal = 25 * h * h;
  return w > ideal ? ideal + 0.4 * (w - ideal) : w;
}

function profileBmi(){
  const w = Number(profile.weightKg), h = Number(profile.heightCm) / 100;
  return (w && h) ? w / (h * h) : null;
}

function roundLoadKg(kg){
  // Round in the unit the user sees: 2.5 kg plates/dumbbells, or 5 lb.
  if(weightUnit === 'lb'){
    const lb = Math.max(5, Math.round(kgToLb(kg) / 5) * 5);
    return lbToKg(lb);
  }
  return Math.max(2, Math.round(kg / 2.5) * 2.5);
}

function profileSuggestedKg(ex){
  if(!ex || ex.bw || !profileIsComplete()) return null;
  const name = String(ex.name).toLowerCase();
  const rule = STRENGTH_RATIOS.find(r => r.re.test(name) && !(r.notIf && r.notIf.test(name)));
  if(!rule) return null;
  const kg = effectiveBodyWeightKg() * rule.ratio
    * (EXPERIENCE_FACTOR[profile.experience] || 1)
    * sexFactor(rule.region) * ageFactor();
  return roundLoadKg(kg);
}

function kgForDisplay(kg){
  return weightUnit === 'kg' ? Math.round(kg * 10) / 10 : Math.round(kgToLb(kg) * 2) / 2;
}

// Returns { kg, text, source } for an exercise with no logged history, or null.
function getStartSuggestion(ex){
  if(!ex) return null;
  const preferPlan = profile.suggestFrom === 'plan' && ex.start > 0;
  const fromProfile = preferPlan ? null : profileSuggestedKg(ex);
  const planText = ex.start > 0 ? kgForDisplay(ex.start) + (ex.startMax ? '–' + kgForDisplay(ex.startMax) : '') + weightUnit : '';
  if(fromProfile){
    return { kg: fromProfile, source:'profile', text: kgForDisplay(fromProfile) + weightUnit, planText };
  }
  if(planText) return { kg: ex.start, source:'plan', text: planText, planText };
  return null;
}

async function updateProfileField(field, value){
  if(field === 'weight'){
    const n = parseFloat(value);
    profile.weightKg = n > 0 ? (weightUnit === 'kg' ? n : lbToKg(n)) : undefined;
  }else if(field === 'heightCm' || field === 'age'){
    const n = parseFloat(value);
    profile[field] = n > 0 ? n : undefined;
  }else{
    profile[field] = value;
  }
  await saveProfile();
  if(accessToken) autoPushToDrive();
  render();
  const el = document.getElementById('profile-msg');
  if(el) el.textContent = 'Saved';
}

function updateHeightImperial(ft, inch){
  const totalIn = profile.heightCm ? profile.heightCm / 2.54 : 0;
  let curFt = totalIn ? Math.floor(totalIn / 12) : 0;
  let curIn = totalIn ? Math.round(totalIn - curFt * 12) : 0;
  if(ft !== null) curFt = parseFloat(ft) || 0;
  if(inch !== null) curIn = parseFloat(inch) || 0;
  const cm = (curFt * 12 + curIn) * 2.54;
  updateProfileField('heightCm', cm > 0 ? String(cm) : '');
}

/* ===================== Rest timer ===================== */
const REST_PRESETS = [60, 90, 120, 180];
let restDefault = 90;
let restAuto = true;
let restEndAt = 0;
let restTotal = 0;
let restInterval = null;
let restAudioCtx = null;

function loadRestSettings(){
  try{
    const s = parseInt(localStorage.getItem('rest-seconds'), 10);
    if(s > 0) restDefault = s;
    restAuto = localStorage.getItem('rest-auto') !== '0';
  }catch(e){}
}

function formatRest(sec){
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec/60) + ':' + String(sec % 60).padStart(2,'0');
}

function primeRestAudio(){
  try{
    if(!restAudioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) restAudioCtx = new Ctx();
    }
    if(restAudioCtx && restAudioCtx.state === 'suspended') restAudioCtx.resume();
  }catch(e){}
}

function playRestBeep(){
  if(!restAudioCtx) return;
  try{
    const now = restAudioCtx.currentTime;
    [0, 0.25, 0.5].forEach(offset => {
      const osc = restAudioCtx.createOscillator();
      const gain = restAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
      osc.connect(gain).connect(restAudioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.2);
    });
  }catch(e){}
}

function startRestTimer(seconds){
  primeRestAudio();
  restTotal = seconds || restDefault;
  restEndAt = Date.now() + restTotal * 1000;
  clearInterval(restInterval);
  restInterval = setInterval(tickRestTimer, 250);
  renderRestTimer();
}

function adjustRestTimer(delta){
  if(!restEndAt) return;
  const remaining = Math.max(0, restEndAt - Date.now()) / 1000;
  if(remaining <= 0 && delta < 0) return;
  const next = Math.max(1, remaining + delta);
  restEndAt = Date.now() + next * 1000;
  restTotal = Math.max(restTotal, next);
  if(!restInterval) restInterval = setInterval(tickRestTimer, 250);
  renderRestTimer();
}

function stopRestTimer(){
  clearInterval(restInterval);
  restInterval = null;
  restEndAt = 0;
  renderRestTimer();
}

function setRestDefault(sec){
  restDefault = sec;
  try{ localStorage.setItem('rest-seconds', String(sec)); }catch(e){}
  startRestTimer(sec);
}

function toggleRestAuto(checked){
  restAuto = checked;
  try{ localStorage.setItem('rest-auto', checked ? '1' : '0'); }catch(e){}
}

function tickRestTimer(){
  const remaining = (restEndAt - Date.now()) / 1000;
  if(remaining <= 0){
    clearInterval(restInterval);
    restInterval = null;
    playRestBeep();
    try{ if(navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); }catch(e){}
    renderRestTimer();
    return;
  }
  const timeEl = document.getElementById('rest-time');
  const fillEl = document.getElementById('rest-bar-fill');
  if(timeEl) timeEl.textContent = formatRest(remaining);
  if(fillEl) fillEl.style.width = (restTotal ? (remaining / restTotal) * 100 : 0) + '%';
}

function renderRestTimer(){
  const el = document.getElementById('rest-timer');
  if(!el) return;
  if(!restEndAt){
    el.className = 'rest-timer hidden';
    el.innerHTML = '';
    document.body.classList.remove('rest-open');
    return;
  }
  document.body.classList.add('rest-open');
  const remaining = (restEndAt - Date.now()) / 1000;
  const done = remaining <= 0;
  el.className = 'rest-timer' + (done ? ' done' : '');
  el.innerHTML = `
    <div class="rest-top">
      <div style="flex:1">
        <div class="rest-label">${done ? 'Rest complete' : 'Resting'}</div>
        <div class="rest-time" id="rest-time">${done ? 'Next set!' : formatRest(remaining)}</div>
      </div>
      ${done ? '' : `<button class="rest-btn" onclick="adjustRestTimer(-15)" aria-label="Subtract 15 seconds">-15</button>
      <button class="rest-btn" onclick="adjustRestTimer(15)" aria-label="Add 15 seconds">+15</button>`}
      <button class="rest-btn" onclick="stopRestTimer()">${done ? 'Dismiss' : 'Skip'}</button>
    </div>
    <div class="rest-bar"><div class="rest-bar-fill" id="rest-bar-fill" style="width:${done ? 0 : (remaining / restTotal) * 100}%"></div></div>
    <div class="rest-bottom">
      ${REST_PRESETS.map(s => `<button class="rest-chip ${s === restTotal ? 'active' : ''}" onclick="setRestDefault(${s})">${formatRest(s)}</button>`).join('')}
      <label class="rest-auto"><input type="checkbox" ${restAuto ? 'checked' : ''} onchange="toggleRestAuto(this.checked)"> Auto-start</label>
    </div>`;
}

/* ===================== Backup: export / import ===================== */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function backupDateStamp(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function setBackupMsg(text){
  const el = document.getElementById('backup-msg');
  if(el) el.textContent = text;
}

function exportBackupJson(){
  const data = {
    app: 'iron-log',
    version: 1,
    exportedAt: new Date().toISOString(),
    weightUnit,
    header: appHeader,
    profile,
    program,
    history
  };
  downloadFile(`iron-log-backup-${backupDateStamp()}.json`, JSON.stringify(data, null, 2), 'application/json');
  setBackupMsg(`Exported ${history.length} session${history.length === 1 ? '' : 's'} and your program.`);
}

function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportHistoryCsv(){
  const lines = [['date','day','exercise','set','weight','unit','reps'].join(',')];
  history.forEach(sess => {
    const day = program.find(d => d.id === sess.dayId);
    const dayName = sess.dayName || (day ? day.name : '');
    Object.keys(sess.exercises || {}).forEach(key => {
      let meta = findExerciseMetaByCanonical(key);
      if(!meta && day) meta = day.exercises.find(e => e.id === key);
      const exName = meta ? meta.name : key;
      (sess.exercises[key] || []).forEach((s, i) => {
        lines.push([
          new Date(sess.date).toISOString().slice(0,10),
          dayName, exName, i + 1,
          s.weight ? toDisplayWeight(s.weight) : '',
          weightUnit, s.reps
        ].map(csvCell).join(','));
      });
    });
  });
  downloadFile(`iron-log-history-${backupDateStamp()}.csv`, lines.join('\n'), 'text/csv');
  setBackupMsg('Exported history as CSV (opens in Excel / Google Sheets).');
}

let pendingImport = null;

function triggerImport(){
  const input = document.getElementById('import-file');
  if(input){ input.value = ''; input.click(); }
}

function handleImportFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ setBackupMsg('That file is not valid JSON.'); return; }
    const hist = Array.isArray(data) ? data : data && data.history;
    const prog = data && Array.isArray(data.program) ? data.program : null;
    const validHist = Array.isArray(hist) && hist.every(s => s && s.date && s.exercises && typeof s.exercises === 'object');
    const validProg = !prog || prog.every(d => d && d.id && Array.isArray(d.exercises));
    if(!validHist || !validProg){
      setBackupMsg('This doesn’t look like an Iron Log backup file.');
      return;
    }
    pendingImport = {
      history: hist,
      program: prog,
      header: data.header && data.header.title ? data.header : null,
      profile: data.profile && typeof data.profile === 'object' && !Array.isArray(data.profile) ? data.profile : null,
      weightUnit: data.weightUnit === 'kg' || data.weightUnit === 'lb' ? data.weightUnit : null
    };
    showImportChoice(file.name);
  };
  reader.onerror = () => setBackupMsg('Could not read that file.');
  reader.readAsText(file);
}

function showImportChoice(fileName){
  const p = pendingImport;
  const root = document.getElementById('modal-root');
  document.body.style.overflow = 'hidden';
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h3 class="modal-title">Import backup</h3>
          <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
        </div>
        <p class="import-summary">${escapeHtml(fileName)} contains ${p.history.length} session${p.history.length === 1 ? '' : 's'}${p.program ? ` and a ${p.program.length}-day program` : ''}.</p>
        <div class="import-choice">
          <button onclick="applyImport('merge')"><strong>Merge</strong><span>Add these sessions to your current history. Your program stays as is.</span></button>
          <button class="danger" onclick="applyImport('replace')"><strong>Replace everything</strong><span>Overwrite your current history${p.program ? ', program' : ''} and settings with this backup.</span></button>
          <button onclick="closeModal()"><strong>Cancel</strong></button>
        </div>
      </div>
    </div>`;
}

async function applyImport(mode){
  const p = pendingImport;
  if(!p) return;
  if(mode === 'replace'){
    if(!confirm('Replace all of your current data with this backup? This cannot be undone.')) return;
    history = mergeHistories([], p.history);
    if(p.program && p.program.length){
      program = p.program;
      await saveProgram();
    }
    if(p.header){
      appHeader = p.header;
      await saveHeader();
      renderHeader();
    }
    if(p.profile){
      profile = p.profile;
      await saveProfile();
    }
    if(p.weightUnit) setWeightUnit(p.weightUnit);
  }else{
    history = mergeHistories(history, p.history);
  }
  await saveHistory();
  pendingImport = null;
  closeModal();
  if(!program.find(d => d.id === currentDayId) && program.length) currentDayId = program[0].id;
  resetRows();
  editingSessionId = null;
  editingSessionDraft = null;
  currentView = 'history';
  render();
  setBackupMsg(mode === 'replace' ? 'Backup restored.' : `Merged — you now have ${history.length} sessions.`);
  autoPushToDrive();
}

(async function init(){
  await loadProgram();
  await loadHistory();
  await loadHeader();
  await loadProfile();
  loadWeightUnit();
  loadRestSettings();
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  renderHeader();
  renderUnitToggle();
  if(!currentDayId && program.length) currentDayId = program[0].id;
  resetRows();

  // First launch opens the default plan; the Personalize wizard is available from its tab.
  currentView = history.length ? 'dashboard' : 'log';
  render();

  setSyncStatus('');
  if(localStorage.getItem('gdrive-connected') === '1'){
    try{
      await ensureTokenClient();
      await requestToken('none');
      await syncWithDrive();
    }catch(e){
      setSyncStatus('Tap to reconnect');
    }
  }
})();
</script>

</body>
</html>
